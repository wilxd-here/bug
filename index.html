<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>xaerisoft Void</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #030712;
            --glass-bg: rgba(10, 15, 30, 0.75);
            --glass-border: rgba(0, 212, 255, 0.2);
            --primary-blue: #00d2ff;
            --primary-grad: linear-gradient(90deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%);
            --accent-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            background: #030712;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        .video-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0.35;
            filter: brightness(0.7) contrast(1.1);
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, var(--bg-dark) 90%);
            z-index: 0;
            pointer-events: none;
        }

        /* INTRO SCREEN */
        #intro-screen {
            position: absolute;
            inset: 0;
            background: #030712;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .intro-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            opacity: 0;
            transform: translateY(20px);
            position: absolute;
            animation: fadeInOut 3s forwards;
        }

        #intro-1 { animation-delay: 0.2s; }
        #intro-2 { animation-delay: 3.2s; color: var(--primary-blue); text-shadow: 0 0 15px var(--accent-glow); }
        #intro-3 { animation-delay: 6.2s; font-size: 16px; color: var(--text-muted); }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* MAIN CONTENT */
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .header-logo-img {
            width: 36px; height: 36px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--primary-blue);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .logo-text h1 { font-size: 13px; letter-spacing: 1px; font-family: 'Orbitron', sans-serif; color: #fff; }
        .logo-text p { font-size: 10px; color: var(--primary-blue); font-weight: 600; }

        .badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            color: var(--text-main);
            display: flex; align-items: center; gap: 6px;
        }
        .badge.online::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background: #00d2ff; border-radius: 50%; box-shadow: 0 0 8px #00d2ff;
        }

        .center-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0 15px 0;
        }

        .main-logo-wrapper {
            position: relative;
            width: 110px; height: 110px;
        }

        .main-logo-img {
            width: 100%; height: 100%;
            object-fit: cover;
            border-radius: 22px;
            border: 2px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.25);
            position: relative; z-index: 2;
        }

        .brand-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .brand-title h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 2px;
        }
        .brand-title p {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }
        .clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--primary-blue);
            letter-spacing: 2px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--primary-grad);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 82, 212, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline {
            background: rgba(10, 15, 30, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid var(--glass-border);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .login-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: #fff;
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .input-group input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 15px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary-blue);
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        #dashboard-view {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .user-info-box {
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 14px;
            text-align: center;
        }
        .user-role-badge {
            display: inline-block;
            background: var(--primary-blue);
            color: #030712;
            padding: 3px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            margin-top: 5px;
            text-transform: uppercase;
        }
    </style>

    <!-- MENGHUBUNGKAN KE FILE DATABASE TERPISAH -->
    <script src="data/database.js"></script>
</head>
<body>

    <!-- INTRO ANIMATION SCREEN -->
    <div id="intro-screen">
        <div id="intro-1" class="intro-text">Welcome</div>
        <div id="intro-2" class="intro-text">xaerisoft</div>
        <div id="intro-3" class="intro-text">poweredby Wil</div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container">
        <video class="video-bg" autoplay loop muted playsinline>
            <source src="background.mp4" type="video/mp4">
        </video>
        <div class="bg-overlay"></div>

        <div class="content" id="main-content">
            <header>
                <div class="logo-area">
                    <img src="Logo.jpg" alt="Logo" class="header-logo-img" onerror="this.style.display='none'">
                    <div class="logo-text">
                        <h1>XAERISOFT VOID</h1>
                        <p>Poweredby Wil</p>
                    </div>
                </div>
                <div class="badge online">ONLINE</div>
            </header>

            <div class="center-logo-container">
                <div class="main-logo-wrapper">
                    <img src="Logo.jpg" alt="Logo" class="main-logo-img">
                </div>
            </div>

            <div class="brand-title">
                <h2>XAERISOFT</h2>
                <p>V O I D</p>
                <div class="clock" id="live-clock">00:00:00</div>
            </div>

            <!-- HOME VIEW -->
            <div id="home-view" class="btn-group">
                <button class="btn btn-primary" onclick="openLoginModal()">
                    ⚡ Masuk
                </button>
                <a href="https://wa.me/62895384482069?text=Halo%20min,%20saya%20mau%20ambil%20free%20akun%20trial%201%20hari" target="_blank" class="btn btn-outline">
                    🎁 Free akun trial 1h
                </a>
                <a href="https://wa.me/62895384482069?text=Halo%20min,%20saya%20mau%20beli%20akun%20xaerisoft%20void" target="_blank" class="btn btn-outline">
                    💬 BUY AKUN HUBUNGI ADMIN (WA)
                </a>
            </div>

            <!-- DASHBOARD VIEW -->
            <div id="dashboard-view">
                <div class="user-info-box">
                    <h4 id="display-username" style="font-size: 15px; font-weight: 700;">-</h4>
                    <div id="display-role" class="user-role-badge">Member</div>
                </div>
                <div class="btn-group">
                    <div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">
                        Akses Panel & Tools Terbuka Sesuai Role Anda.
                    </div>
                    <button class="btn btn-outline" onclick="logout()">Keluar Akun</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LOGIN -->
    <div class="modal-overlay" id="loginModal">
        <div class="login-card">
            <button class="close-modal" onclick="closeLoginModal()">&times;</button>
            <h3>Autentikasi Akun</h3>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUser" placeholder="Masukkan username">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Masukkan password">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()" style="margin-top: 5px;">Masuk Sekarang</button>
        </div>
    </div>

    <script>
        // Sembunyikan intro setelah 9 detik
        setTimeout(() => {
            const intro = document.getElementById('intro-screen');
            const content = document.getElementById('main-content');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                content.style.opacity = '1';
            }, 500);
        }, 9000);

        // Jam Real-time
        function updateClock() {
            const now = new Date();
            let h = now.getHours().toString().padStart(2, '0');
            let m = now.getMinutes().toString().padStart(2, '0');
            let s = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('live-clock').textContent = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Modal Control
        function openLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
        }
        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        // Proses Login Mengecek ke database.js di folder data
        function handleLogin() {
            const userIn = document.getElementById('loginUser').value.trim();
            const passIn = document.getElementById('loginPass').value.trim();

            //databaseAkun otomatis terbaca dari file data/database.js
            const foundUser = databaseAkun.find(acc => acc.username === userIn && acc.password === passIn);

            if (foundUser) {
                alert(`Login Berhasil! Selamat datang, ${foundUser.username} (${foundUser.role.toUpperCase()})`);
                closeLoginModal();

                document.getElementById('home-view').style.display = 'none';
                document.getElementById('dashboard-view').style.display = 'flex';
                document.getElementById('display-username').textContent = foundUser.username;
                document.getElementById('display-role').textContent = foundUser.role;
            } else {
                alert("Username atau Password salah!");
            }
        }

        function logout() {
            document.getElementById('home-view').style.display = 'flex';
            document.getElementById('dashboard-view').style.display = 'none';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
        }
    </script>
</body>
</html>
